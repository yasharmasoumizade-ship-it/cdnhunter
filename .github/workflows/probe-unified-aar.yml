name: Probe unified AAR (mihomo + sing-box libbox)

# Experiment only: does ONE gomobile AAR containing both cores build? Does not touch
# build-unified.yml or android/. Runs on demand, or when unified-probe/** changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'unified-probe/**'
      - '.github/workflows/probe-unified-aar.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools'

      - name: Install SDK + NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Go version
        run: go version

      - name: Build unified AAR (arm64 only, probe)
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            cd unified-probe
            cp ../mihomo-mobile/mobile.go .
            go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
            go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
            export PATH=$PATH:$(go env GOPATH)/bin
            echo "STEP gomobile-init"; gomobile init
            echo "STEP go-mod-tidy"; go mod tidy -v
            echo "STEP gomobile-bind"
            gomobile bind -v -target android/arm64 -androidapi 24 \
              -javapkg=com.cdnhunter.mihomo \
              -tags with_gvisor,cmfa,with_quic,with_utls,badlinkname,tfogo_checklinkname0 \
              -ldflags='-s -w -checklinkname=0' \
              -o libcores.aar . github.com/sagernet/sing-box/experimental/libbox
            ls -la libcores.aar
          } 2>&1 | tee /tmp/probe.log

      - name: Surface failure as annotations (the run log is not readable from outside)
        if: failure()
        shell: bash
        run: |
          [ -f /tmp/probe.log ] || exit 0
          LAST=$(grep '^STEP ' /tmp/probe.log | tail -1)
          grep -v 'go: downloading' /tmp/probe.log | grep -v '^STEP ' > /tmp/probe.filtered || true
          BODY=$(tail -n 45 /tmp/probe.filtered | cut -c1-260 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1')
          echo "::error title=probe failed at ${LAST:-unknown}::$BODY"

      - name: Inspect AAR
        shell: bash
        run: |
          set -uo pipefail
          cd unified-probe
          mkdir -p x && unzip -o -q libcores.aar -d x
          {
            echo "== native libs"; find x -name '*.so' -exec ls -la {} \;
            echo "== classes"; unzip -l x/classes.jar | grep -E 'com/cdnhunter/mihomo/(mobile/Mobile|libbox/Libbox|libbox/PlatformInterface|libbox/BoxService)\.class|go/Seq\.class'
            echo "== PlatformInterface"; javap -cp x/classes.jar com.cdnhunter.mihomo.libbox.PlatformInterface
          } > /tmp/inspect.log 2>&1
          BODY=$(cut -c1-220 /tmp/inspect.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1')
          echo "::notice title=unified AAR contents::$BODY"
          {
            echo "== libbox top-level API"; javap -cp x/classes.jar com.cdnhunter.mihomo.libbox.Libbox | grep -E 'newService|setup|checkConfig|newStandaloneCommandClient|BoxService|version' 
            echo "== BoxService"; javap -cp x/classes.jar com.cdnhunter.mihomo.libbox.BoxService
            echo "== SetupOptions"; javap -cp x/classes.jar com.cdnhunter.mihomo.libbox.SetupOptions | head -20
          } > /tmp/inspect2.log 2>&1
          BODY=$(cut -c1-220 /tmp/inspect2.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1')
          echo "::notice title=libbox API::$BODY"

      - uses: actions/upload-artifact@v4
        with:
          name: libcores-probe
          path: unified-probe/libcores.aar
          retention-days: 3
