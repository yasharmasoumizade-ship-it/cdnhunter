name: Probe unified AAR (mihomo + sing-box libbox)

# Experiment only: does ONE gomobile AAR containing both cores build? Does not touch
# build-unified.yml or android/. Runs on demand, or when unified-probe/** changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'unified-probe/**'
      - '.github/workflows/probe-unified-aar.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [android/arm64, android/arm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools'

      - name: Install SDK + NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Go version
        run: go version

      - name: Build unified AAR (probe)
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            cd unified-probe
            cp ../mihomo-mobile/mobile.go .
            go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
            go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
            export PATH=$PATH:$(go env GOPATH)/bin
            echo "STEP gomobile-init"; gomobile init
            echo "STEP go-mod-tidy"; go mod tidy -v
            echo "STEP gomobile-bind"
            gomobile bind -v -target ${{ matrix.target }} -androidapi 24 \
              -javapkg=com.cdnhunter.mihomo \
              -tags with_gvisor,cmfa,with_quic,with_utls,badlinkname,tfogo_checklinkname0 \
              -ldflags='-s -w -checklinkname=0' \
              -o libcores.aar . github.com/sagernet/sing-box/experimental/libbox
            ls -la libcores.aar
          } 2>&1 | tee /tmp/probe.log

      - name: Surface failure as annotations (the run log is not readable from outside)
        if: failure()
        shell: bash
        run: |
          [ -f /tmp/probe.log ] || exit 0
          LAST=$(grep '^STEP ' /tmp/probe.log | tail -1)
          grep -v 'go: downloading' /tmp/probe.log | grep -v '^STEP ' > /tmp/probe.filtered || true
          BODY=$(tail -n 45 /tmp/probe.filtered | cut -c1-260 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1')
          echo "::error title=probe failed at ${LAST:-unknown}::$BODY"

      - name: Inspect AAR
        shell: bash
        run: |
          set +e
          cd unified-probe
          mkdir -p x && unzip -o -q libcores.aar -d x
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          note() { local t="$1" f="$2"; echo "::notice title=${{ matrix.target }} $t::$(cut -c1-230 "$f" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1')"; }
          {
            echo "== native libs"; find x -name '*.so' -exec ls -la {} \;
            echo "== go/Seq.class entries in classes.jar (must be 1)"; unzip -l x/classes.jar | grep -c 'go/Seq.class'
            echo "== JNI_OnLoad definitions (must be 1 per .so)"; for so in $(find x -name '*.so'); do "$NM" -D --defined-only "$so" | grep -c ' JNI_OnLoad'; done
            echo "== duplicate exported symbols (should be none)"; for so in $(find x -name '*.so'); do "$NM" -D --defined-only "$so" | awk '{print $3}' | sort | uniq -d | head -5; done
            echo "== both bindings present"; unzip -l x/classes.jar | grep -E 'mihomo/mobile/Mobile.class|mihomo/libbox/Libbox.class' | awk '{print $4}'
          } > /tmp/i1.log 2>&1; note "native audit" /tmp/i1.log
          {
            echo "== libbox classes"; unzip -l x/classes.jar | awk '{print $4}' | grep 'mihomo/libbox/' | sed 's#.*/libbox/##; s#.class##' | grep -v '\$' | tr '\n' ' '
            echo; echo "== Libbox statics"; javap -cp x/classes.jar com.cdnhunter.mihomo.libbox.Libbox | grep -E 'static native' | sed 's/public static native //'
          } > /tmp/i2.log 2>&1; note "libbox classes" /tmp/i2.log
          { javap -cp x/classes.jar com.cdnhunter.mihomo.libbox.PlatformInterface | sed 's/com.cdnhunter.mihomo.libbox.//g; s/public abstract //'; } > /tmp/i3.log 2>&1; note "PlatformInterface" /tmp/i3.log
          {
            for c in CommandServer CommandServerHandler OverrideOptions TunOptions; do echo "== $c"; javap -cp x/classes.jar com.cdnhunter.mihomo.libbox.$c | sed 's/com.cdnhunter.mihomo.libbox.//g; s/public final native //; s/public abstract //; s/public native //' | grep -v 'refnum\|incRefnum\|Compiled from' ; done
          } > /tmp/i4.log 2>&1; note "server+handler+options" /tmp/i4.log
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: libcores-probe-${{ strategy.job-index }}
          path: unified-probe/libcores.aar
          retention-days: 3
