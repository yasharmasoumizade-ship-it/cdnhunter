name: Build CDN Hunter (VPN + Scanner)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'mihomo-mobile/**'
      - '.github/workflows/build-unified.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Install SDK + NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Build libmihomo.aar (mihomo core, native)
        run: |
          set -euo pipefail
          cd mihomo-mobile
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          go get -tool golang.org/x/mobile/cmd/gobind
          go get golang.org/x/mobile/cmd/gomobile
          go mod tidy -v
          gomobile bind -v -tags with_gvisor,cmfa -androidapi 24 -javapkg=com.cdnhunter.mihomo -ldflags='-s -w -checklinkname=0' -o libmihomo.aar .
          ls -la libmihomo.aar

      - name: DEBUG list AAR contents
        run: |
          mkdir -p /tmp/aar_check
          cd /tmp/aar_check
          unzip -o "$GITHUB_WORKSPACE/mihomo-mobile/libmihomo.aar" -d extracted
          echo "=== classes.jar contents (mihomo/mobile related) ==="
          find extracted -name "classes.jar" -exec unzip -l {} \; | grep -iE "mihomo|mobile" || echo "NO MATCH FOUND"
          echo "=== full classes.jar listing (first 100 lines) ==="
          find extracted -name "classes.jar" -exec unzip -l {} \; | head -100
          echo "=== javap signature of Mobile.class ==="
          mkdir -p /tmp/classdump && cd /tmp/classdump && unzip -o "$GITHUB_WORKSPACE/mihomo-mobile/libmihomo.aar" classes.jar -d . && unzip -o classes.jar "com/cdnhunter/mihomo/mobile/Mobile.class" -d . && javap com/cdnhunter/mihomo/mobile/Mobile.class

      - name: Place .aar in app/libs
        run: |
          # Wipe app/libs completely before copying in the AAR this workflow
          # just built. Only removing the old xray filename (libv2ray.aar)
          # let a stale committed mihomo.aar sit alongside the freshly-built
          # libmihomo.aar — both are gomobile-built AARs sharing the same Go
          # runtime classes and libgojni.so, so Gradle failed with duplicate
          # class / duplicate native-lib errors. This directory should only
          # ever contain the one AAR this workflow produces.
          rm -rf android/app/libs
          mkdir -p android/app/libs
          cp mihomo-mobile/libmihomo.aar android/app/libs/
          ls -la android/app/libs/

      - name: Bundle mihomo geo assets
        run: |
          mkdir -p android/app/src/main/assets
          curl -sL "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb" -o android/app/src/main/assets/geoip.metadb
          curl -sL "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat" -o android/app/src/main/assets/geosite.dat
          rm -f android/app/src/main/assets/geoip.dat
          ls -la android/app/src/main/assets/

      - name: Generate signing keystore
        # build.gradle.kts's release signingConfig reads the store/key passwords
        # ONLY from the CDNHUNTER_* env vars (no hardcoded fallback anymore), so
        # both this generation step and the build step below source them from the
        # same GitHub Actions repository secrets. Set these under
        # Settings -> Secrets and variables -> Actions:
        #   CDNHUNTER_KEYSTORE_PASSWORD   (required)
        #   CDNHUNTER_KEY_PASSWORD        (required)
        #   CDNHUNTER_KEY_ALIAS           (optional, defaults to "cdnhunter")
        # This is a self-signed key for producing an installable (non-Play-Store)
        # APK, regenerated each run; keeping the credentials in secrets keeps them
        # out of git. If a required secret is unset, the passwords resolve empty
        # and the build fails loudly at signing rather than shipping a key whose
        # password lives in source.
        env:
          CDNHUNTER_KEYSTORE_PASSWORD: ${{ secrets.CDNHUNTER_KEYSTORE_PASSWORD }}
          CDNHUNTER_KEY_PASSWORD: ${{ secrets.CDNHUNTER_KEY_PASSWORD }}
          CDNHUNTER_KEY_ALIAS: ${{ secrets.CDNHUNTER_KEY_ALIAS }}
        run: |
          ALIAS="${CDNHUNTER_KEY_ALIAS:-cdnhunter}"
          keytool -genkeypair -v \
            -keystore android/keystore.jks \
            -storepass "$CDNHUNTER_KEYSTORE_PASSWORD" \
            -alias "$ALIAS" \
            -keypass "$CDNHUNTER_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CDN Hunter, OU=Dev, O=CDN Hunter, L=Unknown, S=Unknown, C=US"
          ls -la android/keystore.jks

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          curl -sL "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o /tmp/gradle.zip
          unzip -qo /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Release APK
        working-directory: android
        env:
          CI_VERSION_CODE: ${{ github.run_number }}
          CDNHUNTER_KEYSTORE_PASSWORD: ${{ secrets.CDNHUNTER_KEYSTORE_PASSWORD }}
          CDNHUNTER_KEY_PASSWORD: ${{ secrets.CDNHUNTER_KEY_PASSWORD }}
          CDNHUNTER_KEY_ALIAS: ${{ secrets.CDNHUNTER_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec ls -la {} \;

          UNIVERSAL=$(find android/app/build/outputs/apk -iname "*universal*.apk" | head -1)
          ARM64=$(find android/app/build/outputs/apk -iname "*arm64-v8a*.apk" | head -1)
          ARMV7=$(find android/app/build/outputs/apk -iname "*armeabi-v7a*.apk" | head -1)

          test -n "$UNIVERSAL" && cp "$UNIVERSAL" out/CDN-Hunter-v4-universal.apk
          test -n "$ARM64" && cp "$ARM64" out/CDN-Hunter-v4-arm64.apk
          test -n "$ARMV7" && cp "$ARMV7" out/CDN-Hunter-v4-armv7.apk

          if [ ! -f out/CDN-Hunter-v4-universal.apk ] && [ ! -f out/CDN-Hunter-v4-arm64.apk ]; then
            APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
            test -n "$APK" && cp "$APK" out/CDN-Hunter-v4.apk
          fi

          ls -la out

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0-build${{ github.run_number }}
          name: CDN Hunter v4.0 (Build ${{ github.run_number }})
          body: |
            ## CDN Hunter v4.0 — VPN Client (mihomo core)

            Full Compose app now running on the embedded mihomo (Clash.Meta) core instead of Xray-core.

            ### Features:
            - mihomo/Clash.Meta engine — VLESS, VMess, Trojan, Shadowsocks, Hysteria2, TUIC, and everything else Clash.Meta supports
            - Native TUN handling via mihomo itself (no separate tun2socks step)
            - Server location (real IP-based geo lookup)
            - Traffic stats (upload/download)
            - Speed monitor

            ### Which file to download?
            - Most phones (made after ~2017): **CDN-Hunter-v4-arm64.apk**
            - Older/32-bit phones: **CDN-Hunter-v4-armv7.apk**
            - Not sure / installer errors: **CDN-Hunter-v4-universal.apk**
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
