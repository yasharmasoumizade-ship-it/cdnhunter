name: Build CDN Hunter (VPN + Scanner)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'mihomo-mobile/**'
      - 'cores-mobile/**'
      - '.github/workflows/build-unified.yml'

permissions:
  contents: write

env:
  # ROLLBACK SWITCH. 'true': one AAR with mihomo + sing-box (cores-mobile/). 'false': the previous mihomo-only
  # AAR (mihomo-mobile/). Flipping to 'false' is only valid while no Kotlin references com.cdnhunter.mihomo.libbox.
  UNIFIED_AAR: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          # Google removed the legacy 'tools' package from the SDK repository around
          # 2026-09-14; the action's default packages list ('tools platform-tools') now
          # fails immediately with "Failed to find package 'tools'" before any build step
          # runs. Only platform-tools (adb, fastboot) is actually needed here -- the
          # platform/build-tools versions this project needs are installed explicitly by
          # the next step ("Install SDK + NDK"), same as before.
          packages: 'platform-tools'

      - name: Install SDK + NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Build libmihomo.aar (mihomo core, native)
        if: env.UNIFIED_AAR != 'true'
        run: |
          set -euo pipefail
          cd mihomo-mobile
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          go get -tool golang.org/x/mobile/cmd/gobind
          go get golang.org/x/mobile/cmd/gomobile
          go mod tidy -v
          gomobile bind -v -tags with_gvisor,cmfa -androidapi 24 -javapkg=com.cdnhunter.mihomo -ldflags='-s -w -checklinkname=0' -o libmihomo.aar .
          ls -la libmihomo.aar

      - name: DEBUG list AAR contents
        if: env.UNIFIED_AAR != 'true'
        run: |
          mkdir -p /tmp/aar_check
          cd /tmp/aar_check
          unzip -o "$GITHUB_WORKSPACE/mihomo-mobile/libmihomo.aar" -d extracted
          echo "=== classes.jar contents (mihomo/mobile related) ==="
          find extracted -name "classes.jar" -exec unzip -l {} \; | grep -iE "mihomo|mobile" || echo "NO MATCH FOUND"
          echo "=== full classes.jar listing (first 100 lines) ==="
          find extracted -name "classes.jar" -exec unzip -l {} \; | head -100
          echo "=== javap signature of Mobile.class ==="
          mkdir -p /tmp/classdump && cd /tmp/classdump && unzip -o "$GITHUB_WORKSPACE/mihomo-mobile/libmihomo.aar" classes.jar -d . && unzip -o classes.jar "com/cdnhunter/mihomo/mobile/Mobile.class" -d . && javap com/cdnhunter/mihomo/mobile/Mobile.class

      - name: Build cores AAR (mihomo + sing-box libbox, one Go runtime)
        if: env.UNIFIED_AAR == 'true'
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          cd cores-mobile
          cp ../mihomo-mobile/mobile.go .
          GOMOBILE_VERSION=v0.1.12
          go install github.com/sagernet/gomobile/cmd/gomobile@${GOMOBILE_VERSION}
          go install github.com/sagernet/gomobile/cmd/gobind@${GOMOBILE_VERSION}
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          go mod tidy -v
          gomobile bind -v -target android/arm64,android/arm -androidapi 24 \
            -javapkg=com.cdnhunter.mihomo \
            -tags with_gvisor,cmfa,with_quic,with_utls,badlinkname,tfogo_checklinkname0 \
            -ldflags='-s -w -checklinkname=0' \
            -o libcores.aar . github.com/sagernet/sing-box/experimental/libbox
          ls -la libcores.aar

      - name: Record cores artifact (checksum + versions + per-ABI size)
        if: env.UNIFIED_AAR == 'true'
        run: |
          set -euo pipefail
          cd cores-mobile
          SHA=$(sha256sum libcores.aar | cut -d' ' -f1)
          SIZE=$(stat -c %s libcores.aar)
          MIHOMO=$(go list -m -f '{{.Version}}' github.com/metacubex/mihomo)
          SING=$(go list -m -f '{{.Version}}' github.com/sagernet/sing-box)
          GOMOBILE=$(go list -m -f '{{.Version}}' github.com/sagernet/gomobile)
          GOV=$(go version)
          rm -rf /tmp/cx && mkdir /tmp/cx && unzip -q libcores.aar -d /tmp/cx
          SOS=$(find /tmp/cx -name '*.so' -printf '%P %s bytes\n')
          SEQ=$(unzip -l /tmp/cx/classes.jar | grep -c 'go/Seq.class')
          {
            echo "libcores.aar sha256: $SHA"
            echo "libcores.aar size:   $SIZE bytes"
            echo "mihomo:   $MIHOMO"
            echo "sing-box: $SING"
            echo "gomobile (SagerNet fork): $GOMOBILE"
            echo "$GOV"
            echo "commit:   $GITHUB_SHA"
            echo "native libs:"; echo "$SOS"
            echo "go/Seq.class entries (must be 1): $SEQ"
          } | tee "$GITHUB_WORKSPACE/cores-build-info.txt"
          test "$SEQ" = "1"
          echo "::notice title=cores AAR::sha256=$SHA mihomo=$MIHOMO sing-box=$SING gomobile=$GOMOBILE size=$SIZE%0A$(echo "$SOS" | awk 'BEGIN{ORS="%0A"}1')"

      - name: Place .aar in app/libs
        run: |
          # Wipe app/libs completely before copying in the AAR this workflow
          # just built. Only removing the old xray filename (libv2ray.aar)
          # let a stale committed mihomo.aar sit alongside the freshly-built
          # libmihomo.aar — both are gomobile-built AARs sharing the same Go
          # runtime classes and libgojni.so, so Gradle failed with duplicate
          # class / duplicate native-lib errors. This directory should only
          # ever contain the one AAR this workflow produces.
          rm -rf android/app/libs
          mkdir -p android/app/libs
          if [ "$UNIFIED_AAR" = "true" ]; then
            cp cores-mobile/libcores.aar android/app/libs/
          else
            cp mihomo-mobile/libmihomo.aar android/app/libs/
          fi
          ls -la android/app/libs/

      - name: Bundle mihomo geo assets
        run: |
          mkdir -p android/app/src/main/assets
          curl -sL "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb" -o android/app/src/main/assets/geoip.metadb
          curl -sL "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat" -o android/app/src/main/assets/geosite.dat
          rm -f android/app/src/main/assets/geoip.dat
          ls -la android/app/src/main/assets/

      - name: Bundle sing-box Iran rule-sets (official SagerNet, pinned commit + sha256)
        # Official SagerNet rule-sets for the sing-box fallback engine. Pinned to an exact commit of the
        # `rule-set` branch and verified by sha256: a changed or tampered file fails the build instead of
        # shipping. To update: bump the commit SHA and the hash together, on purpose.
        run: |
          set -euo pipefail
          GEOIP_COMMIT=7fe82a879ad2666526730c195b55a6d8d9147908
          GEOSITE_COMMIT=53e0e99be15953f1865c4f3f4cffe8c8f8543dff
          mkdir -p android/app/src/main/assets
          curl -fsSL "https://raw.githubusercontent.com/SagerNet/sing-geoip/${GEOIP_COMMIT}/geoip-ir.srs" -o android/app/src/main/assets/singbox-geoip-ir.srs
          curl -fsSL "https://raw.githubusercontent.com/SagerNet/sing-geosite/${GEOSITE_COMMIT}/geosite-category-ir.srs" -o android/app/src/main/assets/singbox-geosite-category-ir.srs
          cd android/app/src/main/assets
          echo "c88af3372f71234f6d015d0452ba472f26b0d9d62e82ae5167d066c1df24b8f5  singbox-geoip-ir.srs" | sha256sum -c -
          echo "5e4ef5289e0b4f73018854730b2ab049860ec1e87e1a601fdbe976bcb6c669b6  singbox-geosite-category-ir.srs" | sha256sum -c -

      - name: Generate signing keystore
        # build.gradle.kts's release signingConfig reads the store/key passwords
        # ONLY from the CDNHUNTER_* env vars (no hardcoded fallback anymore), so
        # both this generation step and the build step below source them from the
        # same GitHub Actions repository secrets. Set these under
        # Settings -> Secrets and variables -> Actions:
        #   CDNHUNTER_KEYSTORE_PASSWORD   (required)
        #   CDNHUNTER_KEY_PASSWORD        (required)
        #   CDNHUNTER_KEY_ALIAS           (optional, defaults to "cdnhunter")
        # This is a self-signed key for producing an installable (non-Play-Store)
        # APK, regenerated each run; keeping the credentials in secrets keeps them
        # out of git. If a required secret is unset, the passwords resolve empty
        # and the build fails loudly at signing rather than shipping a key whose
        # password lives in source.
        env:
          CDNHUNTER_KEYSTORE_PASSWORD: ${{ secrets.CDNHUNTER_KEYSTORE_PASSWORD }}
          CDNHUNTER_KEY_PASSWORD: ${{ secrets.CDNHUNTER_KEY_PASSWORD }}
          CDNHUNTER_KEY_ALIAS: ${{ secrets.CDNHUNTER_KEY_ALIAS }}
          CDNHUNTER_KEYSTORE_BASE64: ${{ secrets.CDNHUNTER_KEYSTORE_BASE64 }}
        run: |
          echo "$CDNHUNTER_KEYSTORE_BASE64" | base64 -d > android/keystore.jks
          ls -la android/keystore.jks

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          curl -sL "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o /tmp/gradle.zip
          unzip -qo /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Unit tests (reported as annotations; does not block the APK yet)
        working-directory: android
        continue-on-error: true
        env:
          CI_VERSION_CODE: ${{ github.run_number }}
        run: |
          set +e
          ./gradlew testDebugUnitTest --no-daemon > /tmp/unit.log 2>&1
          code=$?
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tot = fail = skip = 0
          bad = []
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              tot += int(r.get("tests", 0)); fail += int(r.get("failures", 0)) + int(r.get("errors", 0)); skip += int(r.get("skipped", 0))
              for tc in r.iter("testcase"):
                  for k in ("failure", "error"):
                      e = tc.find(k)
                      if e is not None:
                          bad.append(tc.get("classname", "").split(".")[-1] + "." + tc.get("name", "") + ": " + (e.get("message") or "")[:160].replace("\n", " "))
          print(f"::notice title=unit tests::{tot} run, {fail} failed, {skip} skipped")
          for b in bad[:8]:
              print(f"::error title=unit test failed::{b}")
          PY
          if [ $code -ne 0 ] && ! ls app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then
            BODY=$(grep -v 'go: downloading' /tmp/unit.log | tail -n 40 | cut -c1-240 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1')
            echo "::error title=unit tests did not run (compile?)::$BODY"
          fi
          exit $code

      - name: Build Release APK
        working-directory: android
        env:
          CI_VERSION_CODE: ${{ github.run_number }}
          CDNHUNTER_KEYSTORE_PASSWORD: ${{ secrets.CDNHUNTER_KEYSTORE_PASSWORD }}
          CDNHUNTER_KEY_PASSWORD: ${{ secrets.CDNHUNTER_KEY_PASSWORD }}
          CDNHUNTER_KEY_ALIAS: ${{ secrets.CDNHUNTER_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Report APK sizes
        if: always()
        run: |
          set +e
          BODY=$(find android/app/build/outputs/apk -name '*.apk' -printf '%f %s\n' 2>/dev/null | awk '{printf "%s %.1f MB%%0A", $1, $2/1048576}')
          echo "::notice title=APK sizes::${BODY:-no apk found}"

      - name: Collect APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec ls -la {} \;

          UNIVERSAL=$(find android/app/build/outputs/apk -iname "*universal*.apk" | head -1)
          ARM64=$(find android/app/build/outputs/apk -iname "*arm64-v8a*.apk" | head -1)
          ARMV7=$(find android/app/build/outputs/apk -iname "*armeabi-v7a*.apk" | head -1)

          test -n "$UNIVERSAL" && cp "$UNIVERSAL" out/CDN-Hunter-v4-universal.apk
          test -n "$ARM64" && cp "$ARM64" out/CDN-Hunter-v4-arm64.apk
          test -n "$ARMV7" && cp "$ARMV7" out/CDN-Hunter-v4-armv7.apk

          if [ ! -f out/CDN-Hunter-v4-universal.apk ] && [ ! -f out/CDN-Hunter-v4-arm64.apk ]; then
            APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
            test -n "$APK" && cp "$APK" out/CDN-Hunter-v4.apk
          fi

          [ -f cores-build-info.txt ] && cp cores-build-info.txt out/ || true
          ls -la out

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0-build${{ github.run_number }}
          name: CDN Hunter v4.0 (Build ${{ github.run_number }})
          body: |
            ## CDN Hunter v4.0 — VPN Client (mihomo core)

            Full Compose app now running on the embedded mihomo (Clash.Meta) core instead of Xray-core.

            ### Features:
            - mihomo/Clash.Meta engine — VLESS, VMess, Trojan, Shadowsocks, Hysteria2, TUIC, and everything else Clash.Meta supports
            - Native TUN handling via mihomo itself (no separate tun2socks step)
            - Server location (real IP-based geo lookup)
            - Traffic stats (upload/download)
            - Speed monitor

            ### Which file to download?
            - Most phones (made after ~2017): **CDN-Hunter-v4-arm64.apk**
            - Older/32-bit phones: **CDN-Hunter-v4-armv7.apk**
            - Not sure / installer errors: **CDN-Hunter-v4-universal.apk**
          files: |
            out/*.apk
            out/cores-build-info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
