# 2048m was enough while the release build only assembled and signed. R8 now runs on
# assembleRelease and does whole-program analysis over Compose plus the bundled AAR,
# which is the step that OOMs first; 4096m is comfortably within a GitHub-hosted
# runner's memory.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
